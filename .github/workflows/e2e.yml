name: E2E
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  e2e:
    # Los PR de forks no reciben secretos.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Secretos solo en el Environment `develop-e2e` (cuentas QA dedicadas; nunca llaves de servicio de Supabase ni secretos de producción).
    environment: develop-e2e
    # Toca develop: una corrida a la vez en todos los repos; las demás esperan en cola.
    concurrency:
      group: develop-e2e
      cancel-in-progress: false
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      E2E_CAJERO_EMAIL: ${{ secrets.E2E_CAJERO_EMAIL }}
      E2E_CAJERO_PASSWORD: ${{ secrets.E2E_CAJERO_PASSWORD }}
      E2E_COCINA_EMAIL: ${{ secrets.E2E_COCINA_EMAIL }}
      E2E_COCINA_PASSWORD: ${{ secrets.E2E_COCINA_PASSWORD }}
      E2E_MESERO_EMAIL: ${{ secrets.E2E_MESERO_EMAIL }}
      E2E_MESERO_PASSWORD: ${{ secrets.E2E_MESERO_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      # Solo trazas, solo si falla, 3 días. Nunca storageState ni capturas con sesión.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/**/trace.zip
          retention-days: 3
          if-no-files-found: ignore
