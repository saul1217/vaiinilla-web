name: Claude
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read
jobs:
  claude:
    # Solo quien tiene permiso de escritura (OWNER/MEMBER/COLLABORATOR) puede invocar a Claude.
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: develop
          # persist-credentials: true para que base_branch pueda hacer git fetch origin develop (run 39893079348 fallaba con exit 128).
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.256 (tag v1)
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: develop
          claude_args: |
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git:*),Bash(npm:*),Bash(npx:*),Bash(node:*)"
            --append-system-prompt "Reglas del repo: trabaja siempre directamente sobre la rama develop (git checkout develop). Nunca hagas push a main ni abras PRs. Al terminar una corrección: 1) corre npm ci si hace falta, luego npm test y, si existe el script, npm run build (que incluye la verificación de tipos); 2) si las pruebas y el build pasan, haz commit en develop y git push origin HEAD:develop; 3) si alguna prueba o el build fallan, no hagas push: explica en el issue qué falló. Responde siempre en el issue con el commit subido a develop y el resultado de las pruebas y del build."
